id: t2_g2b
tier: T2
name: 나라장터(G2B) 운영자 공지사항
character: >
  WebSquare SPA. 목록 화면은 URL 로 열리지만 값은 전부 JS 가 그린다. 상세는 URL 자체가
  없어 행을 클릭해야만 열린다. 게다가 필드 값이 <input> 안에 들어 있어 텍스트만 긁는
  도구는 제목 말고는 아무것도 못 가져간다 — 렌더링 능력을 재는 티어의 존재 이유다.
render: js
encoding: utf-8
base_url: https://www.g2b.go.kr

# 실측 (2026-09-08, playwright chromium)
#  - 메인 https://www.g2b.go.kr/ 은 진입 즉시 '나라장터 공지사항' 레이어 팝업이 4겹 뜬다.
#    닫지 않으면 다음 클릭을 가로챈다.
#  - 메인의 a[title="나라장터 공지사항 더보기"](id 접미사 btnBbsAdd)를 누르면 **새 창**으로
#    https://www.g2b.go.kr/ehelpdesk/R23AB00000134L_01/ 가 열린다.
#  - 그 목록 URL 은 **세션 부트스트랩 없이 직접 열린다.** 그래서 list 는 클릭 체인 없이
#    URL 로 진입한다(단, 여기서도 레이어 팝업 4겹이 뜬다).
#  - 목록 그리드 id 는 uuid 가 안 붙어 안정적: #mf_wfm_container_grdPst_body_table
#    컬럼 11개: 게시물번호 게시판분류 팝업우선순위 제목 문의처 이용자유형 기관명 작성자
#              작성일시 추천수 조회수     ->  **첨부 컬럼이 없다** (has_attachment = null)
#  - 데이터는 POST /fm/fma/fmaa/Pst/selectNtcPstList.do 에서 온다. 브라우저 세션 안에서는
#    200 이고 세션 밖에서는 403 {"ErrorCode":-801} 이다. 우리는 직접 쏘지 않고 응답만 본다.
#  - 상세: 행의 제목 <a> 를 클릭하면 같은 URL 위에서 화면만 바뀐다(selectPst.do 호출).
#    R23AB00000134D_01 이라는 상세 화면 id 는 존재하지만 URL 로 직접 열면 타임아웃이다.
#    => 상세는 반드시 목록에서 행을 눌러 들어간다. case_id 는 화면의 게시물번호로 붙인다.
#  - 메인에는 '기관별 공지사항'(bbsNo R23AB00000153) 판도 있다. 이번 범위에서는 뺀다.

fetch:
  method: GET
  needs_browser: true
  freeze: rendered_dom     # 원본 바이트가 아니므로 ENCODING 실패모드 판정에서 제외

nav:
  entry: "https://www.g2b.go.kr/ehelpdesk/R23AB00000134L_01/"
  list_api: "https://www.g2b.go.kr/fm/fma/fmaa/Pst/selectNtcPstList.do"
  steps:
    - {wait: 5000}
    - {close_popups: true}        # 레이어 팝업 4겹. 안 닫으면 클릭이 막힌다
    - {wait: 1500}
  # 상세 진입: 목록 행의 제목 링크를 누른다. row 는 케이스마다 지정(1부터)
  row_selector: "#mf_wfm_container_grdPst_body_table tbody tr"
  cell_selector: "a"
  row_cell: 0
  detail_steps:
    - {wait: 4000}
    - {close_popups: true}
  wait_after_click_ms: 3000

# 이 대상에 도구를 붙일 때 주는 힌트 등급(README §11). 전 도구에 동일하게 적용한다.
hint_level: H2                       # 진입 경로(팝업 닫기·새창)까지. 셀렉터는 주지 않는다.

cases:
  list:
    - {id: "ntc-p1"}                 # url 없음 -> nav 경로. 목록 1페이지 10건
  detail:                            # row = 목록에서 몇 번째 행인가 (1부터)
    - {id: "ntc-777", row: 1}
    - {id: "ntc-702", row: 2}
    - {id: "ntc-648", row: 3}
