id: t1_d2b
tier: T1
name: 국방전자조달(D2B) 공지사항
character: >
  서버 렌더 JSP. 평문 GET 으로 목록·상세가 모두 나온다. 브라우저가 필요 없어 비LLM 베이스라인의
  상한선을 재는 구간이다. 게시판 4종을 모두 넣어 **일반화**를 함께 잰다 — 한 게시판에 맞춘
  셀렉터가 다른 게시판에서 무너지는지가 여기서 드러난다.
render: static
encoding: utf-8
base_url: https://www.d2b.go.kr

# 게시판마다 목록 컬럼이 다르다. 이게 이 대상의 핵심이다.
#   NEWS01  번호/제목/첨부/작성자/작성일자/조회            (6)
#   NEWS02  번호/제목/첨부/부대명/작성자/작성일자/조회      (7)
#   NEWS03  번호/제목/첨부/부서명/작성자/작성일자/조회      (7)
#   NEWS04  번호/제목/첨부/작성자/작성일자/조회            (헤더 6 / 실제 행 5)
#
# NEWS04 함정: 헤더에 '작성자' 칸이 있는데 본문 행에는 없다(th 6 / td 5).
# 컬럼을 위치로만 맞추는 도구는 여기서 작성일자를 작성자로 읽는다. 의도적으로 넣었다.
#
# 상세 항목: 제목/작성자/담당부서(부서명)/구분/게시기간/첨부파일/본문
#            작성일자·조회수는 상세 화면에 없다 -> gold 에서 null
boards:
  NEWS01: {name: "일반공지사항", list: "getNoticeList.do?key=91&bbsId=NEWS01", view: "getNoticeView.do?key=91&bbsId=NEWS01"}
  NEWS02: {name: "수요부대별공지사항", list: "demandNoticeList.do?key=92&bbsId=NEWS02", view: "demandNoticeView.do?key=92&bbsId=NEWS02"}
  NEWS03: {name: "방위사업청공지사항", list: "demandNoticeList.do?key=357&bbsId=NEWS03", view: "demandNoticeView.do?key=357&bbsId=NEWS03"}
  NEWS04: {name: "시스템개선공지사항", list: "systImprvNoticeList.do?key=953&bbsId=NEWS04", view: "systImprvNoticeView.do?key=953&bbsId=NEWS04"}

fetch:
  method: GET
  needs_browser: false

# 도구에 주는 힌트 등급(README §11). 전 도구에 동일하게 적용한다.
