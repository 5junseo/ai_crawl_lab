# LiteLLM proxy — 모든 도구의 LLM 호출이 여기 한 곳을 지난다 (README §4-3).
#
#   conda activate aicrawl
#   set PYTHONUTF8=1                     <- 빼면 못 뜬다. 아래 참고
#   set PYTHONPATH=.                     <- callbacks 의 harness.litellm_logger 를 찾게
#   litellm --config harness/litellm_config.yaml --port 4000
#
# PYTHONUTF8 을 왜 박아야 하나 (2026-09-09 실측):
#   프록시는 이 파일을 `open()` 기본 인코딩으로 읽는다. 한국어 윈도우에서는 그게 cp949 라
#   **이 주석의 한글에서 UnicodeDecodeError 로 죽는다.** 설정이 틀린 게 아니라 못 읽는 것이라
#   에러가 YAML 파서 안쪽에서 나서 원인이 잘 안 보인다. 주석을 지우는 대신 UTF-8 모드로 띄운다.
#
# 도구에는 base_url=http://127.0.0.1:4000, api_key=$LITELLM_MASTER_KEY 만 준다.
# 도구가 벤더 API 를 직접 치면 그 비용은 리포트에서 사라진다 — 어댑터 리뷰 시 이걸 먼저 본다.

model_list:
  # --- 주력: 클라우드 ---
  - model_name: claude-opus-5              # pricing.yaml 의 키와 이름을 같게 유지할 것
    litellm_params:
      model: anthropic/claude-opus-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-sonnet-5
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
  # --- Google Gemini (단가는 pricing.yaml. 이름을 서로 같게 유지할 것) ---
  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
  - model_name: gemini-2.5-flash-lite
    litellm_params:
      model: gemini/gemini-2.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
  - model_name: gemini-3.8-flash
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY
  - model_name: gemini-2.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY

  # --- 보조: 로컬(비용 0 축). 모델은 GPU 사양 확정 후 교체 ---
  - model_name: "ollama/qwen2.5:14b-instruct"
    litellm_params:
      model: "ollama/qwen2.5:14b-instruct"
      api_base: os.environ/OLLAMA_BASE_URL
  - model_name: "ollama/gemma2:27b"
    litellm_params:
      model: "ollama/gemma2:27b"
      api_base: os.environ/OLLAMA_BASE_URL

litellm_settings:
  callbacks: harness.litellm_logger.handler   # 요청 1건 = logs/litellm.jsonl 1줄
  drop_params: true                           # 도구가 던지는 미지원 파라미터로 죽지 않게
  set_verbose: false

  # 지출 상한은 여기 `max_budget` 으로 걸지 않는다. **DB 가 없으면 무시된다** —
  # 프록시가 경고 한 줄만 남기고 전부 통과시킨다(2026-09-09 실측: 상한 $0.0000001 로 5회 통과).
  # 대신 harness/litellm_logger.py 의 async_pre_call_hook 이 pricing.yaml 단가로 직접 막는다.
  #
  #   set AICRAWL_MAX_USD=5      상한(USD). 기본 5 = 약 6,900원. 0 이하면 끈다.
  #
  # 호출 **전에** 막으므로 초과분은 아예 안 나간다. 누적은 프록시 프로세스 수명 기준이라
  # 재시작하면 0 부터 다시 센다. Phase 3(에이전트) 전에 실제 지출을 보고 값을 다시 정할 것.

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
