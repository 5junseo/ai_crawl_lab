# 모델/서비스 단가표. harness/meter.py 가 이 파일만 보고 비용을 계산한다.
# 단위: USD per 1M tokens (MTok). 도구 자체 리포트는 믿지 않는다(README §4-3).

meta:
  updated: "2026-09-03"
  # 환율은 리포트 재현성을 위해 고정값으로 박는다. 갱신 시 run_id 를 새로 판다.
  usd_krw: 1380.0
  notes: >
    cache_write / cache_read 는 Anthropic 표준 배수(입력가 x1.25 / x0.1)를 적용했다.
    캐시 히트 토큰을 입력가로 계산하면 비용이 3~4배 부풀려진다 — 반드시 분리 집계.

# ---------------------------------------------------------------- LLM (토큰 과금)
llm:
  # --- Anthropic (2026-06 기준 공식 단가) ---
  claude-opus-5:
    provider: anthropic
    input: 5.00
    output: 25.00
    cache_write: 6.25
    cache_read: 0.50
    context: 1000000
  claude-sonnet-5:
    provider: anthropic
    input: 2.00
    output: 10.00
    cache_write: 2.50
    cache_read: 0.20
    context: 1000000
  claude-haiku-4-5:
    provider: anthropic
    input: 1.00
    output: 5.00
    cache_write: 1.25
    cache_read: 0.10
    context: 200000

  # --- Google Gemini (ai.google.dev/gemini-api/docs/pricing 에서 2026-09-09 확인) ---
  # 유료 티어 기준. Batch/Flex 모드는 전 모델 50% 이므로 채택하면 여기 값을 절반으로 다시 적는다.
  # cache_read 는 입력가의 10%(공식). cache_write 는 Gemini 가 토큰당이 아니라
  # **시간당 보관료**($1/1M토큰/시간)로 받는다 -> 토큰 단가로 적을 수 없어 0 으로 둔다.
  # 명시적 캐시를 쓰기 시작하면 meter 로는 안 잡히니 그때 별도 항목을 만들 것.
  gemini-2.5-flash-lite:
    provider: google
    input: 0.10
    output: 0.40
    cache_write: 0.0
    cache_read: 0.01
    context: 1000000
  gemini-2.5-flash:
    provider: google
    input: 0.30
    output: 2.50
    cache_write: 0.0
    cache_read: 0.03
    context: 1000000
  gemini-3.1-flash-lite:
    provider: google
    input: 0.25
    output: 1.50
    cache_write: 0.0
    cache_read: 0.025
    context: 1000000
  gemini-3.8-flash:
    provider: google
    # 2026-12-31 까지 도입가. 2027-01-01 부터 $1.50 / $7.50 로 오른다.
    input: 0.75
    output: 3.75
    cache_write: 0.0
    cache_read: 0.075
    context: 1000000
  gemini-2.5-pro:
    provider: google
    # 프롬프트 200K 초과 시 $2.50 / $15.00. 이 저장소 최대 프롬프트가 47K 라 해당 없음.
    input: 1.25
    output: 10.00
    cache_write: 0.0
    cache_read: 0.125
    context: 1000000
  gemini-3.1-pro-preview:
    provider: google
    # 200K 초과 시 $4.00 / $18.00.
    input: 2.00
    output: 12.00
    cache_write: 0.0
    cache_read: 0.20
    context: 1000000

  # --- OpenAI (미확정: 채택 시 공식 단가 확인 후 기입) ---
  gpt-placeholder:
    provider: openai
    input: null
    output: null
    cache_write: null
    cache_read: null

  # --- 로컬 (Ollama). 토큰 비용 0, 대신 전력/GPU 점유는 별도 축으로 본다 ---
  "ollama/qwen2.5:14b-instruct":
    provider: ollama
    input: 0.0
    output: 0.0
    cache_write: 0.0
    cache_read: 0.0
  "ollama/gemma2:27b":
    provider: ollama
    input: 0.0
    output: 0.0
    cache_write: 0.0
    cache_read: 0.0

# ------------------------------------------------- 비토큰 과금 도구 (환산 테이블)
#
# **여기는 LiteLLM 프록시를 안 지난다.** 토큰 상한(`harness/litellm_logger`)이 이 지출은
# 하나도 못 막는다. 그래서 어댑터가 요청 **전에** `harness/ledger.py` 로 직접 막는다.
# `max_units` 는 그 도구에 허용할 총 단위 수다(무료 티어 한도로 잡아 뒀다).
services:
  firecrawl_cloud:
    unit: credit
    # firecrawl.dev/pricing 에서 2026-09-09 확인 (연간결제 기준 월정액).
    #   무료      1,000 크레딧/월 (카드 불필요)
    #   Hobby     $16   /  5,000  -> $0.0032   /크레딧
    #   Standard  $83   / 100,000 -> $0.00083
    #   Growth    $333  / 500,000 -> $0.000666
    #   Scale     $599  / 1,000,000 -> $0.000599
    # 우리는 무료 티어 안에서 돈다(22건 x 5크레딧 = 110). **실제 현금 지출은 0 이다.**
    # 그래도 리포트에 0원으로 적으면 거짓말이므로, 유료 진입가인 Hobby 단가로 환산해
    # '이만큼 쓰면 얼마'를 적는다. 1만건 환산은 Standard 단가가 맞는 규모다.
    usd_per_unit: 0.0032
    usd_per_unit_note: "Hobby($16/5,000). 1만건 규모면 Standard($0.00083)로 다시 계산할 것"
    credits:
      scrape: 1          # 페이지 1건
      scrape_json: 5     # 1(scrape) + 4(JSON/advanced format 추가분)
      map: 1
      search: 2          # 결과 10건당
    max_units: 900       # 무료 티어 1,000 의 90%. 넘으면 어댑터가 요청 전에 멈춘다
    note: "셀프호스팅은 크레딧이 없고 LLM 토큰만 나가므로 llm: 항목으로 계산한다."
  skyvern_cloud:
    unit: credit
    # skyvern.com/pricing 에서 2026-09-09 확인.
    #   무료   5,000 크레딧  (~170 액션)
    #   Hobby  $29 / 30,000  (~1,200 액션)
    #   Pro    $149 / 150,000 (~6,200 액션)
    # 페이지는 "1 크레딧 = 1 액션"이라고 적어 놨는데 **자기 숫자와 안 맞는다** —
    # 30,000 / 1,200 = 액션당 25 크레딧이다. 페이지가 따로 명시한 액션당 $0.024 와
    # $29/30,000 x 25 = $0.0242 가 일치하므로 그쪽(25크레딧/액션)을 채택한다.
    usd_per_unit: 0.000967      # $29 / 30,000 크레딧
    credits:
      step: 25           # 액션(step) 1회 = 25 크레딧 = 약 $0.024
    max_units: 4500      # 무료 티어 5,000 의 90%
    note: "건당 스텝 수 x 25. 스텝 수는 RunResult.metrics.steps 로 계측."

# --------------------------------------------------------------- 리포트 환산 기준
report:
  monthly_volume: 10000   # '월 1만건 환산 비용' 계산 기준
